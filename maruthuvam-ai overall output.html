<script>
const LS=(()=>{try{localStorage.setItem('t','1');localStorage.removeItem('t');return localStorage}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
if(!(window.claude&&window.claude.use)){window.claude={use:async n=>{
if(n=='sample'){const f=async(input,o={})=>{const msgs=(typeof input=='string'?[{role:'user',content:input}]:input).map(x=>({...x}));
if(o.images?.length){const b=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(o.images[0])});const t=msgs[msgs.length-1].content;msgs[msgs.length-1].content=[{type:'image',source:{type:'base64',media_type:o.images[0].type||'image/jpeg',data:b}},{type:'text',text:t}]}
const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:msgs})});const d=await r.json();if(!r.ok)throw{code:'error'};const text=(d.content||[]).map(i=>i.text||'').join('');o.onText&&o.onText({text});return{text}};
f.json=async(i,o)=>{const{text}=await f(i,o);return JSON.parse(text.replace(/```json|```/g,'').trim())};f.limits=async()=>({images:true});return f}
if(n=='downloads')return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;a.click()}};
return null}}}

const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const LN={en:'English',hi:'हिन्दी',ta:'தமிழ்',te:'తెలుగు'};
const T={en:['Home','AI Chat','Prescription','Report','Symptoms','My Record','ABHA','Privacy'],hi:['होम','एआई चैट','पर्चा','रिपोर्ट','लक्षण','मेरा रिकॉर्ड','ABHA','गोपनीयता'],ta:['முகப்பு','AI அரட்டை','மருந்துச்சீட்டு','அறிக்கை','அறிகுறிகள்','என் பதிவு','ABHA','தனியுரிமை'],te:['హోమ్','AI చాట్','ప్రిస్క్రిప్షన్','నివేదిక','లక్షణాలు','నా రికార్డు','ABHA','గోప్యత']};
const V=['home','chat','rx','report','sym','rec','abha','priv'];
const DEF={lang:'en',profile:{name:'',allergies:[],vacc:[],hist:[]},abha:'',records:[],log:[],consent:{ai:true,store:true}};
let S=structuredClone(DEF),view='home',chat=[],KEY=null;
// storage (optional AES-GCM passcode lock)
const enc=new TextEncoder(),dec=new TextDecoder(),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){try{if(!S.consent.store)return;if(KEY){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY.k,enc.encode(JSON.stringify(S)));LS.setItem('mai',JSON.stringify({enc:1,salt:b64(KEY.salt),iv:b64(iv),ct:b64(ct)}))}else LS.setItem('mai',JSON.stringify(S))}catch(e){}}
async function load(){try{const r=JSON.parse(LS.getItem('mai')||'null');if(!r)return;if(r.enc){const p=prompt('Enter your MARUTHUVAM passcode');if(!p)return;const salt=ub(r.salt),k=await mkKey(p,salt);S={...DEF,...JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(r.iv)},k,ub(r.ct))))};KEY={k,salt}}else S={...DEF,...r}}catch(e){alert('Could not unlock saved data. Starting fresh view.')}}
const L=a=>{S.log.unshift(new Date().toLocaleString()+' — '+a);S.log=S.log.slice(0,100);save()};
// AI
const SYS=()=>`You are MARUTHUVAM AI, a careful health information assistant for Indian users. Reply in ${LN[S.lang]}. Use simple plain language, short paragraphs. Explain, never diagnose; mention red-flag signs that need a doctor; end serious topics with a reminder to consult a doctor. Profile allergies: ${S.profile.allergies.join(', ')||'none recorded'}.`;
async function sm(){if(!S.consent.ai){alert('AI processing is switched off in Privacy.');return null}const s=await claude.use('sample');if(!s){alert('AI is unavailable in this view.');return null}return s}
// symptoms library (curated general knowledge)
const SYM=[['Common cold','Runny nose, sneezing, sore throat, mild fever, cough','Rest, fluids, warm saline gargle','Fever >3 days, breathlessness'],['Influenza (flu)','High fever, body ache, chills, fatigue, dry cough','Rest, fluids, paracetamol for fever','Breathing trouble, chest pain, high-risk person'],['Dengue','Sudden high fever, severe headache, pain behind eyes, joint pain, rash','Fluids, paracetamol only (avoid NSAIDs/aspirin)','Bleeding, severe belly pain, vomiting, drowsiness'],['Malaria','Fever with chills and sweats, headache, vomiting','Needs blood test and prescribed treatment','Any fever after mosquito exposure'],['Typhoid','Prolonged fever, weakness, stomach pain, constipation/diarrhoea','Clean food and water; needs prescribed antibiotics','Fever >3 days, persistent vomiting'],['Type 2 diabetes','Increased thirst, frequent urination, tiredness, slow healing, blurred vision','Balanced diet, exercise, regular sugar checks','Very high sugar, confusion, fruity breath'],['Hypertension','Often none; headache, dizziness, nosebleed at high levels','Less salt, exercise, regular BP checks','BP very high with chest pain or vision change'],['Anaemia','Tiredness, pale skin, dizziness, breathlessness, brittle nails','Iron-rich foods; test to find the cause','Fainting, chest pain, heavy bleeding'],['Gastroenteritis','Loose stools, vomiting, cramps, mild fever','ORS, fluids, light food','Blood in stool, no urine, severe weakness'],['Asthma','Wheeze, cough at night, chest tightness, breathlessness','Avoid triggers, use inhaler as prescribed','Cannot speak full sentences, blue lips']];
const MED_PROMPT=`Look at this prescription / medicine image (may be handwritten or bilingual). Return ONLY JSON: {"doctor":"","date":"YYYY-MM-DD or empty","diagnosis":"","medicines":[{"name":"","generic":"","dose":"","frequency":"","duration":"","purpose":"","how_to_take":"","side_effects":"","cautions":""}],"notes":""}. Write explanatory fields in ${LN[S.lang]}. If unreadable, return empty medicines.`;
const REP_PROMPT=`Analyse this medical report / discharge summary. Return ONLY JSON: {"date":"YYYY-MM-DD or empty","type":"","summary":"plain-language summary in ${LN[S.lang]}","diagnoses":[""],"tests":[{"name":"","value":"","unit":"","range":"","flag":"normal|high|low","meaning":"what it means in ${LN[S.lang]}"}],"advice":"general next steps and when to see a doctor"}`;
const sample_json=async(prompt,file)=>{const s=await sm();if(!s)return null;const o={cache:false};if(file){const l=await s.limits?.();if(l&&!l.images){alert('Image reading is not enabled here; paste text instead.');return null}o.images=[file]}return s.json(prompt,o)};
function addRec(r){S.records.push({id:Date.now(),date:r.date||new Date().toISOString().slice(0,10),...r});L('Saved '+r.kind+' to record');save();alert('Saved to My Record')}
// views
const views={
home:()=>`<div class="grid" style="align-items:center"><div><small>MARUTHUVAM · மருத்துவம் · चिकित्सा</small><h1>Health<br>Copilot</h1><p>Talk to an AI health assistant, decode prescriptions from a screenshot, understand lab reports in your language, and keep one private health timeline — ABHA-ready.</p><button class="btn" onclick="go('chat')">START CHAT</button> <button class="btn g" onclick="go('rx')">SCAN PRESCRIPTION</button></div><div class="art"><svg viewBox="0 0 300 340" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3df0"/><stop offset="1" stop-color="#5a1fb8"/></linearGradient></defs><rect x="90" y="10" width="140" height="290" rx="26" fill="url(#g)" stroke="#e9a6ff" stroke-width="3"/><path d="M160 40l22 8v18c0 14-9 24-22 30-13-6-22-16-22-30V48z" fill="none" stroke="#ffd0f6" stroke-width="3"/><path d="M160 54v26M147 67h26" stroke="#fff" stroke-width="5"/><rect x="108" y="120" width="90" height="12" rx="6" fill="#ffffff55"/><rect x="108" y="142" width="104" height="12" rx="6" fill="#ffffff33"/><rect x="108" y="164" width="70" height="12" rx="6" fill="#ffffff55"/><circle cx="215" cy="215" r="48" fill="#35b6f0"/><circle cx="215" cy="200" r="16" fill="#f1c9a8"/><path d="M180 262q35-45 70 0z" fill="#fff"/><path d="M40 200h50v90H40z" fill="#9a22b8"/><path d="M65 225l14 6v12c0 9-6 15-14 19-8-4-14-10-14-19v-12z" fill="#ffd0a0"/><g transform="rotate(-25 50 310)"><rect x="20" y="300" width="44" height="18" rx="9" fill="#ff8be8"/></g><circle cx="95" cy="320" r="12" fill="#fff"/></svg></div>
<div class="card"><h2>What you can do</h2>${[['chat','AI health chatbot'],['rx','Tablet & prescription explainer'],['report','Lab report analyzer'],['sym','Symptom library'],['rec','Unified health timeline'],['abha','ABHA link + FHIR export'],['priv','Privacy & consent center']].map(x=>`<p><a href="#" style="color:#fff" onclick="go('${x[0]}');return false">▸ ${x[1]}</a></p>`).join('')}</div></div><p class="warn">Educational information only — not a diagnosis. In an emergency call 108.</p>`,
chat:()=>`<div class="card"><h2>AI Health Chat</h2><div id="msgs">${chat.length?chat.map(m=>`<div class="m ${m.role=='user'?'u':'a'}">${md(m.content)}</div>`).join(''):'<div class="m a">Namaste! Ask me about symptoms, medicines or health habits.</div>'}</div><div class="row" style="margin-top:10px"><input type="text" id="q" placeholder="Describe your symptom or question…" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div>`,
rx:()=>`<div class="card"><h2>Prescription & Tablet Explainer</h2><p>Upload a screenshot or photo of a prescription or tablet strip.</p><div class="row"><input type="file" id="f" accept="image/*"><button class="btn" onclick="runRx()">Explain</button></div></div><div id="out"></div>`,
report:()=>`<div class="card"><h2>Medical Report Analyzer</h2><p>Upload a lab report / discharge summary image, or paste its text.</p><textarea id="t" rows="4" style="width:100%" placeholder="Paste report text (optional)"></textarea><div class="row" style="margin-top:8px"><input type="file" id="f" accept="image/*"><button class="btn" onclick="runRep()">Analyze</button></div></div><div id="out"></div>`,
sym:()=>`<div class="card"><input type="text" id="sf" placeholder="Search condition or symptom…" oninput="symF()" style="width:100%"></div><div id="sl" class="grid"></div><p class="warn">Curated general medical information. Always confirm with a doctor.</p>`,
rec:()=>{const p=S.profile;return `<div class="card"><h2>Personal Health Record</h2><div class="grid"><label>Name<br><input id="pn" value="${esc(p.name)}" onchange="S.profile.name=this.value;save()"></label>${[['allergies','Allergies'],['vacc','Vaccinations'],['hist','Medical history']].map(k=>`<div><b>${k[1]}</b><br>${p[k[0]].map((x,i)=>`<span class="chip" style="cursor:pointer" title="remove" onclick="rm('${k[0]}',${i})">${esc(x)} ✕</span>`).join('')}<div class="row"><input id="a_${k[0]}" placeholder="add…" style="width:130px"><button class="btn g" onclick="add('${k[0]}')">+</button></div></div>`).join('')}</div></div>
<div class="card"><h2>Timeline</h2>${S.records.length?S.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div style="margin-bottom:12px"><span class="chip">${esc(r.date)}</span><span class="chip lo">${esc(r.kind)}</span> ${esc(r.title||'')}<div class="tbl"><small>${esc(r.detail||'')}</small></div></div>`).join(''):'<small>Nothing yet. Save a prescription or report analysis to build your timeline.</small>'}</div>`},
abha:()=>`<div class="card"><h2>ABHA (Ayushman Bharat Health Account)</h2><p>${S.abha?`Linked (mock): <b>${esc(S.abha)}</b>`:'No ABHA linked.'}</p><div class="row"><input type="text" id="ab" placeholder="XX-XXXX-XXXX-XXXX (14 digits)"><button class="btn" onclick="linkAb()">Link (mock)</button></div><small>Demo only — no live ABDM call is made.</small></div><div class="card"><h2>FHIR export</h2><p>Download your record as an HL7 FHIR R4 Bundle (Patient, MedicationRequest, Observation, Condition, AllergyIntolerance, Immunization) so it can map to ABDM health information types.</p><button class="btn" onclick="fhir()">Export FHIR JSON</button></div>`,
priv:()=>`<div class="card"><h2>Privacy & Security Center</h2><p><label><input type="checkbox" ${S.consent.ai?'checked':''} onchange="S.consent.ai=this.checked;L('AI consent '+this.checked)"> Allow AI processing of my questions and uploads</label></p><p><label><input type="checkbox" ${S.consent.store?'checked':''} onchange="S.consent.store=this.checked;if(this.checked)save();else LS.removeItem('mai');L('Local storage consent '+this.checked)"> Allow saving my record on this device</label></p>
<div class="row"><button class="btn g" onclick="lock()">${KEY?'Change passcode':'Encrypt with passcode (AES-256)'}</button><button class="btn g" onclick="fhir()">Export my data</button><button class="btn" style="background:var(--pk)" onclick="wipe()">Delete all my data</button></div><small>Data stays in this browser. Encryption is AES-GCM with a key derived from your passcode; if you forget it the data cannot be recovered.</small></div><div class="card"><h2>Audit log</h2>${S.log.length?S.log.slice(0,25).map(x=>`<div><small>${esc(x)}</small></div>`).join(''):'<small>No activity yet.</small>'}</div>`};
function go(v){view=v;render()}
function render(){document.documentElement.lang=S.lang;$('#nav').innerHTML=`<div class="logo">MARUTHUVAM <span>AI</span></div>`+V.map((v,i)=>`<button class="${v==view?'on':''}" onclick="go('${v}')">${T[S.lang][i]}</button>`).join('')+`<select onchange="S.lang=this.value;save();render()" >${Object.entries(LN).map(([k,n])=>`<option value="${k}" ${k==S.lang?'selected':''}>${n}</option>`).join('')}</select><button onclick="location.reload()">⎋ Logout</button>`;$('#main').innerHTML=views[view]();$('#art3d').innerHTML=a3(view);if(view=='sym')symF();const m=$('#msgs');if(m)m.scrollTop=1e9}
async function send(){const q=$('#q').value.trim();if(!q)return;const s=await sm();if(!s)return;chat.push({role:'user',content:q});chat.push({role:'assistant',content:'…'});L('Chat question sent');render();const msgs=chat.slice(0,-1).map((m,i)=>i==0?{role:'user',content:SYS()+'\n\n'+m.content}:m);try{await s(msgs,{cache:false,onText:({text})=>{chat[chat.length-1].content=text;const b=document.querySelectorAll('.m.a');if(b.length)b[b.length-1].innerHTML=md(text);const m=$('#msgs');m.scrollTop=1e9}})}catch(e){chat[chat.length-1].content='Sorry, the AI could not answer ('+(e.code||'error')+').';render()}}
function table(r){return r.tests?.length?`<div class="tbl"><table><tr><th>Test</th><th>Value</th><th>Range</th><th>Meaning</th></tr>${r.tests.map(t=>`<tr><td>${esc(t.name)}</td><td><span class="chip ${t.flag=='high'?'hi':t.flag=='low'?'lo':'ok'}">${esc(t.value)} ${esc(t.unit)}</span></td><td>${esc(t.range)}</td><td>${esc(t.meaning)}</td></tr>`).join('')}</table></div>`:''}
async function runRx(){const f=$('#f').files[0];if(!f)return alert('Choose an image first');$('#out').innerHTML='<div class="card">Reading prescription…</div>';L('Prescription image analysed');try{const r=await sample_json(MED_PROMPT,f);if(!r)return $('#out').innerHTML='';window._r=r;$('#out').innerHTML=(r.medicines?.length?`<div class="card"><b>${esc(r.diagnosis||'')}</b> <small>${esc(r.doctor||'')} ${esc(r.date||'')}</small></div><div class="grid">${r.medicines.map(m=>`<div class="card"><h2>${esc(m.name)}</h2><small>${esc(m.generic)}</small><p><b>Dose:</b> ${esc(m.dose)} · ${esc(m.frequency)} · ${esc(m.duration)}</p><p><b>Used for:</b> ${esc(m.purpose)}</p><p><b>How to take:</b> ${esc(m.how_to_take)}</p><p><b>Side effects:</b> ${esc(m.side_effects)}</p><p><b>Cautions:</b> ${esc(m.cautions)}</p></div>`).join('')}</div><button class="btn" onclick="addRec({kind:'Prescription',date:_r.date,title:_r.diagnosis||'Prescription',detail:_r.medicines.map(m=>m.name+' '+m.dose+' '+m.frequency).join('; ')})">Save to My Record</button>`:'<div class="card">Could not read any medicines. Try a clearer image.</div>')+'<p class="warn">Follow your doctor’s instructions; this explanation is informational.</p>'}catch(e){$('#out').innerHTML='<div class="card">Analysis failed ('+esc(e.code||'error')+').</div>'}}
async function runRep(){const f=$('#f').files[0],t=$('#t').value.trim();if(!f&&!t)return alert('Add an image or paste text');$('#out').innerHTML='<div class="card">Analyzing…</div>';L('Report analysed');try{const r=await sample_json(REP_PROMPT+(t?'\n\nREPORT TEXT:\n'+t:''),f);if(!r)return $('#out').innerHTML='';window._r=r;$('#out').innerHTML=`<div class="card"><h2>${esc(r.type||'Report')} <small>${esc(r.date||'')}</small></h2><p>${md(r.summary)}</p>${(r.diagnoses||[]).map(d=>`<span class="chip">${esc(d)}</span>`).join('')}</div><div class="card">${table(r)||'No test values found.'}</div><div class="card"><b>Advice:</b> ${md(r.advice)}</div><button class="btn" onclick="addRec({kind:'Report',date:_r.date,title:_r.type||'Lab report',detail:_r.summary+' | '+(_r.tests||[]).filter(t=>t.flag!='normal').map(t=>t.name+' '+t.value+' '+t.flag).join(', '),tests:_r.tests,diagnoses:_r.diagnoses})">Save to My Record</button>`}catch(e){$('#out').innerHTML='<div class="card">Analysis failed ('+esc(e.code||'error')+').</div>'}}
function symF(){const q=($('#sf')?.value||'').toLowerCase();$('#sl').innerHTML=SYM.filter(s=>s.join(' ').toLowerCase().includes(q)).map(s=>`<div class="card"><h2>${s[0]}</h2><p><b>Symptoms:</b> ${s[1]}</p><p><b>Self-care:</b> ${s[2]}</p><p><b>See a doctor if:</b> ${s[3]}</p><button class="btn g" onclick="askAbout('${s[0]}')">Ask AI</button></div>`).join('')}
function askAbout(n){go('chat');setTimeout(()=>{$('#q').value='Explain '+n+' simply: causes, prevention and when to worry.';send()},50)}
const add=k=>{const v=$('#a_'+k).value.trim();if(v){S.profile[k].push(v);save();L('Profile updated');render()}},rm=(k,i)=>{S.profile[k].splice(i,1);save();render()};
function linkAb(){const d=$('#ab').value.replace(/\D/g,'');if(d.length!=14)return alert('ABHA number must be 14 digits');S.abha=d.replace(/(\d{2})(\d{4})(\d{4})(\d{4})/,'$1-$2-$3-$4');L('Mock ABHA linked');save();render()}
async function fhir(){const p=S.profile,e=[{resourceType:'Patient',id:'p1',name:[{text:p.name}],identifier:S.abha?[{system:'https://healthid.ndhm.gov.in',value:S.abha}]:[]},...p.allergies.map(a=>({resourceType:'AllergyIntolerance',patient:{reference:'Patient/p1'},code:{text:a}})),...p.vacc.map(v=>({resourceType:'Immunization',status:'completed',patient:{reference:'Patient/p1'},vaccineCode:{text:v}})),...p.hist.map(h=>({resourceType:'Condition',subject:{reference:'Patient/p1'},code:{text:h}}))];S.records.forEach(r=>{if(r.kind=='Prescription')e.push({resourceType:'MedicationRequest',status:'active',intent:'order',subject:{reference:'Patient/p1'},authoredOn:r.date,medicationCodeableConcept:{text:r.detail}});(r.tests||[]).forEach(t=>e.push({resourceType:'Observation',status:'final',subject:{reference:'Patient/p1'},effectiveDateTime:r.date,code:{text:t.name},valueString:t.value+' '+(t.unit||''),interpretation:[{text:t.flag}]}));(r.diagnoses||[]).forEach(d=>e.push({resourceType:'Condition',subject:{reference:'Patient/p1'},recordedDate:r.date,code:{text:d}}))});const data=JSON.stringify({resourceType:'Bundle',type:'collection',entry:e.map(resource=>({resource}))},null,2);L('FHIR export');try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'maruthuvam-fhir.json',data})}catch(x){alert('Download is not available here; open the page in the Artifact viewer to export.')}}
async function lock(){const p=prompt('Choose a passcode (min 6 characters)');if(!p||p.length<6)return;const salt=crypto.getRandomValues(new Uint8Array(16));KEY={k:await mkKey(p,salt),salt};L('Encryption enabled');await save();render()}
function wipe(){if(!confirm('Delete ALL your data from this device? This cannot be undone.'))return;try{LS.removeItem('mai');LS.removeItem('mai_user')}catch(e){}location.reload()}

const P={heart:'<path d="M100 172C18 112 28 48 70 48c18 0 30 12 30 24 0-12 12-24 30-24 42 0 52 64-30 124z"/><path d="M30 105h35l12-25 18 50 14-35h61"/>',
lungs:'<path d="M100 28v50M100 78l-22 22M100 78l22 22"/><path d="M92 55v62c0 34-30 50-46 40-14-9-8-60 12-86 14-18 30-22 34-16z"/><path d="M108 55v62c0 34 30 50 46 40 14-9 8-60-12-86-14-18-30-22-34-16z"/>',
pills:'<g transform="rotate(-30 100 80)"><rect x="40" y="55" width="120" height="44" rx="22"/><path d="M100 55v44"/></g><circle cx="135" cy="150" r="27"/><path d="M116 150h38"/>',
dna:(()=>{let a='',b='',r='';for(let i=0;i<=20;i++){const y=20+i*8,x=Math.sin(i/2)*45;a+=(i?'L':'M')+(100+x).toFixed(0)+' '+y;b+=(i?'L':'M')+(100-x).toFixed(0)+' '+y;if(i%2==0)r+=`M${(100+x).toFixed(0)} ${y}L${(100-x).toFixed(0)} ${y}`}return `<path d="${a}"/><path d="${b}"/><path d="${r}"/>`})(),
steth:'<path d="M55 30v62c0 40 60 40 60 0V30"/><path d="M85 128v22"/><circle cx="85" cy="165" r="14"/><circle cx="55" cy="28" r="5"/><circle cx="115" cy="28" r="5"/>',
tools:'<g transform="rotate(-25 100 70)"><rect x="25" y="62" width="90" height="16" rx="6"/><path d="M115 62l60 8-60 8z"/></g><g transform="translate(10 95) rotate(25 40 40)"><circle cx="30" cy="25" r="11"/><circle cx="30" cy="62" r="11"/><path d="M40 29L150 55M40 58L150 32"/></g>',
shield:'<path d="M100 25l65 24v45c0 40-28 65-65 82-37-17-65-42-65-82V49z"/><path d="M70 100l22 22 40-46"/>',
lock:'<rect x="48" y="90" width="104" height="82" rx="14"/><path d="M70 90V68a30 30 0 0 1 60 0v22"/><circle cx="100" cy="128" r="9"/><path d="M100 137v14"/>'};
const KV={home:'heart',chat:'lungs',rx:'pills',report:'dna',sym:'steth',rec:'tools',abha:'shield',priv:'lock'};
function a3(v){const s=`<svg viewBox="0 0 200 200">${P[KV[v]]}</svg>`;return `<div class="s3">${s+s+s}</div>`}
// login + heartbeat loader
const bits=async(p,salt)=>{const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))};
function ov(h){let o=$('#ov');if(!o){o=document.createElement('div');o.id='ov';document.body.appendChild(o)}o.innerHTML=h}
function authUI(reg){ov(`<div class="au"><h2>MARUTHUVAM AI</h2><small>${reg?'Create your secure account':'Sign in to your health space'}</small><input id="au" placeholder="Username" autocomplete="username"><input id="ap" type="password" placeholder="Password (min 6)" autocomplete="${reg?'new-password':'current-password'}" onkeydown="if(event.key=='Enter')doAuth(${reg})">${reg?'<input id="ap2" type="password" placeholder="Confirm password">':''}<div id="ae"></div><button class="btn" style="text-align:center" onclick="doAuth(${reg})">${reg?'Create account':'Sign in'}</button><small>Stored only on this device. Passwords are salted and hashed.</small></div>`)}
async function doAuth(reg){const u=$('#au').value.trim(),p=$('#ap').value,e=$('#ae');if(u.length<3||p.length<6){e.textContent='Username 3+ characters, password 6+ characters';return}
try{if(reg){if(p!=$('#ap2').value){e.textContent='Passwords do not match';return}const salt=crypto.getRandomValues(new Uint8Array(16));LS.setItem('mai_user',JSON.stringify({u,salt:b64(salt),h:await bits(p,salt)}))}else{const r=JSON.parse(LS.getItem('mai_user'));if(r.u!=u||r.h!=await bits(p,ub(r.salt))){e.textContent='Wrong username or password';return}}}catch(x){e.textContent='Storage is unavailable in this browser';return}
enter()}
async function enter(){ov(`<div class="ld"><svg class="h" viewBox="0 0 200 200"><path d="M100 172C18 112 28 48 70 48c18 0 30 12 30 24 0-12 12-24 30-24 42 0 52 64-30 124z"/></svg><br><svg class="ecg" viewBox="0 0 400 100"><path d="M0 50H120l15-5 12-35 20 80 18-60 12 20h203"/></svg><p><i>Loading your health space…</i></p></div>`);await load();await new Promise(r=>setTimeout(r,2800));$('#ov').remove();document.body.classList.remove('lock');L('Signed in');render()}
function boot(){document.body.classList.add('lock');let u=null;try{u=LS.getItem('mai_user')}catch(e){}authUI(!u)}
boot();
</script></body></html>
